services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-slotbook}
      POSTGRES_USER: ${DB_USER:-slotbook}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-slotbook} -d ${DB_NAME:-slotbook}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports published to the host: the database stays inside the compose network.
    # PostgreSQL 18+ images expect the mount at /var/lib/postgresql (not .../data).
    volumes:
      - pgdata:/var/lib/postgresql

  app:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_NAME: ${DB_NAME:-slotbook}
      DB_USER: ${DB_USER:-slotbook}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata: